<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BabbelStream app icon</title>
  <desc id="desc">A light blue-tinted tile with a centered slate voice waveform ending in a blue text cursor.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2EAFF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#tile)"/>
  <g fill="#030436">
    <rect x="218" y="432" width="76" height="160" rx="38"/>
    <rect x="342" y="342" width="76" height="340" rx="38"/>
    <rect x="466" y="262" width="76" height="500" rx="38"/>
    <rect x="590" y="372" width="76" height="280" rx="38"/>
  </g>
  <rect x="730" y="262" width="76" height="500" rx="38" fill="#0039D5"/>
</svg>
