version: "3"

tasks:
  check:
    desc: Build BabbelStream and run the executable core behavior checks
    cmds:
      - scripts/swift-project.sh build --product BabbelStream
      - scripts/swift-project.sh run BabbelStreamChecks
      - scripts/check-release-tooling.sh
      - python3 scripts/check-public-hygiene.py
      - python3 scripts/test-public-hygiene.py

  app:build:
    desc: Build the local macOS app bundle into dist/
    cmds:
      - scripts/build-app.sh

  app:install-dev:
    desc: Build a DMG and open the drag-to-Applications installer
    cmds:
      - scripts/install-dev-app.sh

  app:restart:
    desc: Restart the installed /Applications BabbelStream app
    cmds:
      - RESTART_ONLY=1 scripts/install-dev-app.sh

  app:package-dmg:
    desc: Build the local app bundle and package an illustrated drag-to-Applications DMG
    cmds:
      - scripts/package-dmg.sh

  stt:help:
    desc: Show the LiteLLM speech-to-text checker help
    dir: tools/litellm-stt-check
    cmds:
      - python3 check_stt.py --help

  stt:models:
    desc: Probe the configured LiteLLM /v1/models endpoint
    dir: tools/litellm-stt-check
    cmds:
      - python3 check_stt.py --models

  stt:check:
    desc: Transcribe an audio file through the configured LiteLLM endpoint
    dir: tools/litellm-stt-check
    cmds:
      - python3 check_stt.py {{.CLI_ARGS}}

  provider:benchmark:
    desc: Benchmark transcription and cleanup provider latency and jitter
    dir: tools/provider-benchmark
    cmds:
      - python3 benchmark.py {{.CLI_ARGS}}

  app:candidate:
    desc: Package a plain clean optimized candidate without installation or private signing-key lookup
    cmds:
      - BUILD_MODE=candidate scripts/package-dmg.sh

  app:distribution:
    desc: Prepare a clean Developer ID artifact (requires explicitly supplied signing identity)
    cmds:
      - BUILD_MODE=distribution scripts/package-dmg.sh
